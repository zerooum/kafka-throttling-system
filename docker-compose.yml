services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kts-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: q3DqYE9oTm6mYTYxYjIxYz

  redis:
    image: redis:7.4-alpine
    container_name: kts-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  postgres:
    image: postgres:16-alpine
    container_name: kts-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: throttling
      POSTGRES_PASSWORD: throttling
      POSTGRES_DB: throttling

  wiremock:
    image: wiremock/wiremock:3.10.0
    container_name: kts-wiremock
    ports:
      - "8089:8080"
    command: ["--global-response-templating", "--verbose"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: kts-otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
